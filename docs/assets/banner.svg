<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#1a2444"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- subtle node/connection motif suggesting real-time messaging -->
  <g stroke="#30507a" stroke-width="1" opacity="0.5">
    <line x1="90" y1="70" x2="220" y2="130"/>
    <line x1="220" y1="130" x2="150" y2="230"/>
    <line x1="220" y1="130" x2="330" y2="90"/>
    <line x1="150" y1="230" x2="60" y2="190"/>
  </g>
  <g fill="#58a6ff" opacity="0.85">
    <circle cx="90" cy="70" r="4"/>
    <circle cx="220" cy="130" r="5"/>
    <circle cx="150" cy="230" r="4"/>
    <circle cx="330" cy="90" r="3.5"/>
    <circle cx="60" cy="190" r="3.5"/>
  </g>

  <g stroke="#30507a" stroke-width="1" opacity="0.5">
    <line x1="1180" y1="80" x2="1080" y2="150"/>
    <line x1="1080" y1="150" x2="1150" y2="240"/>
    <line x1="1080" y1="150" x2="990" y2="110"/>
  </g>
  <g fill="#58a6ff" opacity="0.85">
    <circle cx="1180" cy="80" r="4"/>
    <circle cx="1080" cy="150" r="5"/>
    <circle cx="1150" cy="240" r="4"/>
    <circle cx="990" cy="110" r="3.5"/>
  </g>

  <!-- chat bubble mark -->
  <g transform="translate(500,90)">
    <rect x="0" y="0" width="56" height="42" rx="12" fill="url(#accent)"/>
    <path d="M14 42 L14 56 L28 42 Z" fill="url(#accent)"/>
    <circle cx="14" cy="21" r="3.5" fill="#0d1117"/>
    <circle cx="28" cy="21" r="3.5" fill="#0d1117"/>
    <circle cx="42" cy="21" r="3.5" fill="#0d1117"/>
  </g>

  <text x="640" y="185" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f0f6fc">Global Chat Platform</text>

  <text x="640" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">A production-grade, Slack-like real-time messaging backend</text>

  <text x="640" y="265" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1" fill="#58a6ff">ASP.NET CORE 10  ·  CQRS  ·  SIGNALR  ·  POSTGRESQL  ·  RABBITMQ  ·  REDIS  ·  OPENSEARCH  ·  AWS</text>
</svg>
