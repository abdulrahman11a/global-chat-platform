services:
  postgres:
    image: postgres:17
    container_name: globalchat-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: GlobalChatDb

    ports:
      - "5432:5432"

    volumes:
      - globalchat_postgres_data:/var/lib/postgresql/data


volumes:
  globalchat_postgres_data:
